name: pln-proyecto-final

services:
  jupyter:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: pln-proyecto-final-jupyter
    container_name: pln-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?falta JUPYTER_TOKEN en infra/.env}
    # Los workers del DataLoader de PyTorch pasan los lotes por memoria compartida; Docker da 64 MB
    shm_size: 8gb
    # Solo en la IP de Tailscale: Jupyter ejecuta código, no debe quedar abierto en la LAN
    ports:
      - "${JUPYTER_BIND}:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ..:/work
      # Caché de Hugging Face fuera del repo: tokenizadores y luego los modelos
      - hf-cache:/home/pln/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  hf-cache:
